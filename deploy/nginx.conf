# Единый вход: сайт — Astro, /api и /healthz — Go.
server {
    listen 80;
    server_name _;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/      { proxy_pass http://backend:8080; }
    location = /healthz { proxy_pass http://backend:8080; }

    location ~ ^/(img|fonts)/ {
        proxy_pass http://frontend:4321;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /_astro/ {
        proxy_pass http://frontend:4321;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { proxy_pass http://frontend:4321; }
}
