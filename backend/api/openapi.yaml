openapi: 3.0.3
info:
  title: Охват API
  version: 0.11.0
  description: |
    API площадки «Охват»: данные главной, регистрация и вход (почта с кодом, Telegram, Google), приложение после входа:
    один аккаунт — два режима («Бизнес» и «Автор»), профили режимов заполняются, когда понадобятся.
    Все ответы — JSON в UTF-8. Ошибки — в едином формате `Error`.

    Сессия — httpOnly cookie `ohvat_session` (Secure на https, SameSite=Lax), в базе только SHA-256 токена.
    CSRF: все POST/PUT/PATCH требуют заголовок `X-CSRF-Token`, равный cookie `ohvat_csrf` (токен выдаёт `GET /api/auth/config`),
    и Origin, совпадающий с адресом сайта (PUBLIC_URL).

    Ограничение частоты (токен-бакеты; память процесса или Redis по `REDIS_URL`): весь `/api` — на адрес
    (`RATE_LIMIT_API_*`); вход `/api/auth/*` (кроме config и logout) — строже, на адрес (`RATE_LIMIT_*`);
    `/api/me*` — на пользователя (`RATE_LIMIT_USER_*`); вебхук бота — общий лимит (`TELEGRAM_WEBHOOK_*`).
    Превышение — 429 `rate_limited` с заголовком `Retry-After`. Загрузка фото — ещё и по пользователю
    (`RATE_LIMIT_UPLOAD_*`).

    Задания бизнеса и анкеты авторов проходят модерацию: `draft` → `pending_review` → `published` | `rejected`
    (с причиной). Черновик сохраняется неполным; полноту сервер проверяет при отправке на проверку
    (ошибки — в `fields`, у блоков — `blocks.<n>`). Отправок на проверку — до
    `MODERATION_SUBMITS_PER_DAY` в сутки (429 `rate_limited`), заданий — до `TASKS_MAX_PER_USER` (409 `tasks_limit`).
    Модератор (админка `/api/admin/*`) публикует, отклоняет с причиной или возвращает на доработку (`changes_requested`,
    замечания по полям — `reviewNotes`); каждая смена статуса пишется в журнал. Решение применяется через 10 с (отмена).
    `MODERATION_MODE=auto` (по умолчанию) — отправленное сразу публикуется: в журнале «на проверке» от владельца и
    «опубликовано» от системы с пометкой «одобрено автоматически», ответ отправки — уже `published`;
    `manual` — ждёт модератора. Режим переключает администратор (хранится в базе; переменная — значение по умолчанию).
    Страница бизнеса (`/b/<slug>`) и профиль автора (`/c/<slug>`) — из блоков, с той же проверкой и правками
    опубликованного (`/api/me/pages/{kind}`); адрес уникален в своём виде, прежние адреса ведут на новый.
    Опубликованное можно изменить без снятия: `PUT` сохраняет правку (`revision`), `…/submit` отправляет её на проверку,
    опубликованная версия видна всем до одобрения; `…/withdraw` снимает с публикации (черновиком становится правка).

    Админка: роли `moderator` (проверка, жалобы, пользователи, блокировка) и `admin` (всё + роли, режим, журнал, сброс 2FA);
    первые администраторы — `ADMIN_EMAILS`. Не сотрудник — 404. Доступ — только после 2FA (TOTP) в этой сессии не раньше
    12 часов назад: иначе 403 `2fa_setup_required` или `2fa_required` (кроме `/api/admin/me` и `/api/admin/2fa/*`).
    Нет права — 403 `forbidden`. Все действия — в неизменяемом журнале (`/api/admin/audit`). Лимиты — `RATE_LIMIT_ADMIN_*`,
    2FA — `RATE_LIMIT_2FA_*`, жалобы — `RATE_LIMIT_COMPLAINT_*`.
servers:
  - url: http://localhost:8000
paths:
  /healthz:
    get:
      summary: Живость сервера и базы
      operationId: health
      responses:
        "200":
          description: Сервер и база работают
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: База недоступна
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/home:
    get:
      summary: Данные главной страницы
      description: Темы, тарифы бизнеса и авторов, частые вопросы — одним запросом.
      operationId: getHome
      responses:
        "200":
          description: Данные главной
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=60" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/config:
    get:
      summary: Способы входа и CSRF-токен
      description: Ставит cookie `ohvat_csrf` (если её нет) и возвращает тот же токен для заголовка `X-CSRF-Token`.
      operationId: getAuthConfig
      tags: [auth]
      responses:
        "200":
          description: Включённые способы входа
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /api/auth/email/start:
    post:
      summary: Отправить код на почту
      description: |
        Код — 6 цифр, действует 10 минут, 5 попыток; в базе только HMAC. Новый код гасит прежние.
        Лимиты: одно письмо на почту в 60 с, 5 писем на почту в час, 20 писем с адреса в час.
      operationId: startEmail
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailStart" }
      responses:
        "202":
          description: Письмо поставлено в отправку
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeSent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/auth/email/verify:
    post:
      summary: Проверить код и войти
      operationId: verifyEmail
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailVerify" }
      responses:
        "200": { $ref: "#/components/responses/LoggedIn" }
        "400":
          description: "validation | code_invalid (attemptsLeft) | code_expired"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/auth/telegram:
    post:
      summary: Вход через Telegram
      description: Данные Telegram Login как есть; подпись HMAC-SHA256 по токену бота, auth_date не старше часа.
      operationId: loginTelegram
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramLogin" }
      responses:
        "200": { $ref: "#/components/responses/LoggedIn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/auth/telegram/bot/start:
    post:
      summary: Вход через бота — ссылка на бота
      description: |
        Одноразовый токен (в базе — SHA-256) в ссылке `https://t.me/<бот>?start=login_<токен>`, срок — TELEGRAM_LOGIN_TTL_MIN
        (5 мин). Секрет браузера — в httpOnly-cookie `ohvat_tglogin` (Path=/api/auth/telegram/bot): забрать вход может только
        этот браузер. Лимит — TELEGRAM_LOGIN_PER_IP_HOUR запусков с адреса в час.
      operationId: startTelegramBot
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BotStart" }
      responses:
        "201":
          description: Ссылка на бота
          headers:
            Set-Cookie: { schema: { type: string }, description: "ohvat_tglogin=…; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/telegram/bot" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/auth/telegram/bot/status:
    post:
      summary: Вход через бота — ждать подтверждения (long-poll до 25 с)
      description: |
        По cookie `ohvat_tglogin`. Подтверждено в боте — сессия (`status: ok`, cookie `ohvat_session`), иначе по истечении
        ожидания `status: pending` — запросить снова. Вход забирается один раз.
      operationId: waitTelegramBot
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: pending — ещё ждём; ok — вошли
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410":
          description: "login_expired — ссылка устарела или уже использована | login_cancelled — «Это не я» в боте"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/telegram/webhook:
    post:
      summary: Вебхук бота Telegram
      description: |
        Обновления Telegram (message, callback_query, my_chat_member). Без CSRF; заголовок
        `X-Telegram-Bot-Api-Secret-Token` = TELEGRAM_WEBHOOK_SECRET. Вебхук ставится при старте сервера
        (setWebhook на ${PUBLIC_URL}/api/telegram/webhook). Повтор одного update_id обрабатывается один раз.
      operationId: telegramWebhook
      tags: [telegram]
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: Update из Bot API }
      responses:
        "200": { description: Принято (или не нужно боту) }
        "401": { description: Секрет не совпал }
        "404": { description: Бот не подключён }
        "500": { description: Сбой — Telegram повторит }
        "503": { description: Перегрузка — Telegram повторит }
  /api/auth/google/start:
    get:
      summary: Переход ко входу через Google
      description: |
        OAuth 2.0 Authorization Code + PKCE (S256) + state. state и verifier — в httpOnly cookie `ohvat_oauth`
        на 10 минут. Ошибки — переход на `/login?error=google_off|consent|google`.
      operationId: startGoogle
      tags: [auth]
      parameters:
        - { name: consent, in: query, required: true, schema: { type: string, enum: ["1"] }, description: Согласие на обработку данных }
      responses:
        "302": { description: Переход в Google }
        "303": { description: Ошибка — переход на страницу входа с кодом ошибки }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/auth/google/callback:
    get:
      summary: Возврат из Google
      description: |
        Сверка state, обмен кода (с verifier), вход. Успех — переход в приложение `/app`;
        ошибка — `/login?error=google|google_state|google_cancel`.
      operationId: googleCallback
      tags: [auth]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303": { description: Переход в приложение или на страницу входа }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/auth/logout:
    post:
      summary: Выйти
      description: Сессия удаляется в базе, cookie стирается.
      operationId: logout
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Вышли }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/me:
    get:
      summary: Кто вошёл
      description: Общие данные, активный режим, способы входа, какие профили режимов заполнены и прогресс заполнения.
      operationId: getMe
      tags: [account]
      security: [{ session: [] }]
      responses:
        "200":
          description: Пользователь, режим и профили
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/mode:
    patch:
      summary: Переключить режим «Бизнес / Автор»
      description: Профиль режима заполнять не обязательно — приложение мягко подскажет.
      operationId: switchMode
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeInput" }
      responses:
        "200":
          description: Режим включён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/profile:
    put:
      summary: Общие данные профиля
      description: Как вас называть и город — 2–80 символов. Первое сохранение отмечает `onboarded`.
      operationId: saveBasics
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BasicsInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/profile/business:
    get:
      summary: Профиль режима «Бизнес»
      operationId: getBusinessProfile
      tags: [account]
      security: [{ session: [] }]
      responses:
        "200":
          description: Профиль (null — ещё не заполнен)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfileResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
    put:
      summary: Сохранить профиль бизнеса
      description: Название и город — 2–80 символов; 1–5 сфер из справочника (`categories.slug`).
      operationId: saveBusinessProfile
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessProfileInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfileResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/profile/creator:
    get:
      summary: Профиль режима «Автор»
      operationId: getCreatorProfile
      tags: [account]
      security: [{ session: [] }]
      responses:
        "200":
          description: Профиль (null — ещё не заполнен)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorProfileResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
    put:
      summary: Сохранить профиль автора
      description: |
        Имя и город — 2–80 символов; 1–5 тем из справочника; 1–5 каналов (https://… или @имя; http повышается до https).
      operationId: saveCreatorProfile
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatorProfileInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorProfileResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/logout-all:
    post:
      summary: Выйти на всех устройствах
      description: Все сеансы аккаунта удаляются (включая этот), cookie стирается.
      operationId: logoutAll
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: Завершено сеансов
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/tasks:
    get:
      summary: Лента опубликованных заданий
      description: |
        Новые сверху. Курсор `next` из ответа — в параметр `cursor` следующего запроса. Отбор (пусто — без отбора):
        любая из сфер (`category` повторяется, до 5), город (без регистра; задания «Вся Россия» подходят любому городу),
        любой из форматов списка (`format` повторяется). Неверный отбор — 400 с `fields`.
      operationId: getFeed
      tags: [tasks]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: category, in: query, style: form, explode: true, schema: { type: array, maxItems: 5, items: { type: string } }, description: slug сфер }
        - { name: city, in: query, schema: { type: string, maxLength: 80 } }
        - { name: format, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/TaskFormat" } } }
      responses:
        "200":
          description: Страница ленты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    get:
      summary: Опубликованное задание
      description: Страница задания для всех. Не опубликовано или нет — 404.
      operationId: getPublicTask
      tags: [tasks]
      responses:
        "200":
          description: Задание (с `brand` и `categoryTitles`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/cards:
    get:
      summary: Лента опубликованных анкет авторов
      description: Только после входа. Новые сверху, курсор — как у заданий. Отбор — тема и город (без регистра).
      operationId: getCardFeed
      tags: [cards]
      security: [{ session: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: topic, in: query, style: form, explode: true, schema: { type: array, maxItems: 5, items: { type: string } }, description: slug тем — любая из них }
        - { name: city, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Страница ленты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardFeed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/cards/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: id автора (`Card.id`) }
    get:
      summary: Опубликованная анкета автора
      operationId: getPublicCard
      tags: [cards]
      security: [{ session: [] }]
      responses:
        "200":
          description: Анкета (с `topicTitles`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/me/tasks:
    get:
      summary: Мои задания (все статусы)
      operationId: listMyTasks
      tags: [tasks]
      security: [{ session: [] }]
      responses:
        "200":
          description: Задания, недавно изменённые сверху (до 100)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Новый черновик задания
      operationId: createTask
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    get:
      summary: Моё задание
      operationId: getMyTask
      tags: [tasks]
      security: [{ session: [] }]
      responses:
        "200":
          description: Задание
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Сохранить черновик (или правку отклонённого)
      operationId: updateTask
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Удалить черновик или отклонённое
      operationId: deleteTask
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/tasks/{id}/submit:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    post:
      summary: Отправить на проверку
      description: |
        Из `draft` или `rejected` в `pending_review` (при `MODERATION_MODE=auto` — сразу `published`). Обязательно:
        название 5–100, город (или «Вся Россия»), сфера, формат, просмотры, оплата от 100 ₽, срок — от
        завтра до 90 дней (по Москве), хотя бы один блок с пунктами (заголовок блока — по желанию).
      operationId: submitTask
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: На проверке или опубликовано (auto)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/tasks/{id}/withdraw:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    post:
      summary: Вернуть в черновик (с проверки или снять с публикации)
      operationId: withdrawTask
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: Черновик
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/card:
    get:
      summary: Моя анкета автора
      operationId: getCard
      tags: [cards]
      security: [{ session: [] }]
      responses:
        "200":
          description: Анкета (null — ещё нет)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Сохранить черновик анкеты
      operationId: saveCard
      tags: [cards]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/card/submit:
    post:
      summary: Отправить анкету на проверку
      description: |
        Обязательно — имя, город, 1–5 тем (своих — до 3), площадки с подписчиками. Блоки и фото — по желанию.
        При `MODERATION_MODE=auto` — сразу `published`.
      operationId: submitCard
      tags: [cards]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: На проверке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/card/withdraw:
    post:
      summary: Вернуть анкету в черновик (с проверки или снять с публикации)
      operationId: withdrawCard
      tags: [cards]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: Черновик
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/drafts/{form}:
    parameters:
      - { name: form, in: path, required: true, schema: { type: string, pattern: "^(task-new|task-[1-9][0-9]{0,17}|card)$" } }
    get:
      summary: Черновик формы редактора
      description: Состояние формы как есть (Redis, запасное — PostgreSQL; 7 дней с последнего сохранения).
      operationId: getDraft
      tags: [drafts]
      security: [{ session: [] }]
      responses:
        "200":
          description: Черновик (null — нет)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Сохранить черновик формы
      description: Тело — JSON-объект до `DRAFT_MAX_KB` (413 `draft_too_large`); частота — `RATE_LIMIT_DRAFT_*` (429).
      operationId: saveDraft
      tags: [drafts]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema:
                type: object
                required: [savedAt]
                properties:
                  savedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Черновик больше предела
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
    delete:
      summary: Удалить черновик формы
      operationId: deleteDraft
      tags: [drafts]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/me/categories:
    get:
      summary: Общие категории и свои
      operationId: listCategories
      tags: [categories]
      security: [{ session: [] }]
      responses:
        "200":
          description: Общий справочник и свои категории пользователя (на проверке и отклонённые)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Своя категория
      description: |
        2–40 символов, без ссылок и брани. Если такая уже есть (без учёта регистра, «ё» и пробелов) — общая или
        своя — вернётся она (`created: false`, 200). Новая — «на проверке» (201): сразу доступна автору в его
        задании и анкете, после модерации может стать общей. Своих на проверке — до 10, в одной анкете — до 3.
      operationId: createCategory
      tags: [categories]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 2, maxLength: 40 }
      responses:
        "200":
          description: Такая уже есть
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryCreated" }
        "201":
          description: Создана, на проверке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/me/categories/similar:
    get:
      summary: Похожие категории (подсказки при вводе)
      description: До 6 — общие и свои на проверке; совпадение, начало, вхождение, опечатка в 1–2 буквы.
      operationId: similarCategories
      tags: [categories]
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Подсказки
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CategoryItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/formats/similar:
    get:
      summary: Подсказки своего формата
      description: |
        До 6 похожих на запрос: форматы списка (`builtin`), известные и свои, уже использованные бизнесом (`own`).
        `id` выбранной подсказки передаётся в `TaskInput.formats` как есть.
      operationId: similarFormats
      tags: [tasks]
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Подсказки
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FormatItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/media:
    post:
      summary: Загрузить фото
      description: |
        `multipart/form-data`: `purpose`, `file`, необязательно `crop` — «x,y,w,h» в долях кадра (после поворота
        по EXIF). Тип — по содержимому: JPEG, PNG, WebP, HEIC (SVG, GIF и анимация — нет); до `MEDIA_MAX_MB`
        (10 МБ) и 40 Мп. Сервер удаляет метаданные (EXIF, геометки), поворачивает по EXIF, обрезает под
        пропорции назначения (аватар 1:1, обложка 16:9; без `crop` — по центру) и хранит WebP 320/800/1600.
        Неприкреплённое к заданию, анкете или профилю удаляется через сутки.
      operationId: uploadMedia
      tags: [media]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [purpose, file]
              properties:
                purpose: { $ref: "#/components/schemas/MediaPurpose" }
                crop: { type: string, example: "0.1,0,0.8,0.9" }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Загружено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: image_too_large — больше 10 МБ или 40 Мп
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: image_type — не JPEG/PNG/WebP/HEIC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503":
          description: busy — очередь обработки полна (Retry-After)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/me/media/{id}:
    delete:
      summary: Удалить своё неприкреплённое фото
      operationId: deleteMedia
      tags: [media]
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/me/avatar:
    put:
      summary: Аватар профиля
      description: "Из загруженного фото назначения `avatar`; `mediaId: null` — убрать."
      operationId: setAvatar
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId]
              additionalProperties: false
              properties:
                mediaId: { type: string, nullable: true }
      responses:
        "200":
          description: Адрес аватара ("" — убран)
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/me/social:
    get:
      summary: Соцсети автора — площадки, статусы, подтверждённые аккаунты
      description: |
        Цифры (подписчики, просмотры, видео) — только из официальных API площадок, не со слов автора; в анкете
        показываются только подтверждённые (`verified`). `available: false` — площадка ещё не подключена («Скоро»):
        сейчас работают Telegram (бот-админ канала или группы) и YouTube (Google OAuth, `youtube.readonly`).
        Цифры обновляются сами раз в `SOCIAL_REFRESH_HOURS` (±2 ч).
      operationId: getSocial
      tags: [social]
      security: [{ session: [] }]
      responses:
        "200":
          description: Площадки по порядку показа
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/social/{platform}/start:
    post:
      summary: Подключить площадку
      description: |
        OAuth (YouTube): адрес страницы разрешения площадки; state (одноразовый, 10 мин, с PKCE) — в httpOnly-cookie
        `ohvat_social` на `/api/social`. Telegram: ссылка на бота `t.me/<бот>?start=ch_<токен>` (30 мин) — в боте
        «Привязать», затем бота добавляют в канал или группу админом. Не больше `SOCIAL_STARTS_PER_HOUR` в час.
      operationId: startSocial
      tags: [social]
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - { name: platform, in: path, required: true, schema: { $ref: "#/components/schemas/SocialPlatform" } }
      responses:
        "200":
          description: Куда перейти
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/social/{platform}/callback:
    get:
      summary: Возврат с площадки (OAuth)
      description: |
        Сверка state (cookie = адрес), сессия того же автора, обмен кода, аккаунты с цифрами; токены — только
        зашифрованно (AES-256-GCM, `TOKEN_ENC_KEY`). Итог — переход на `/app/card?social=<площадка>&result=<итог>#social`:
        `ok`, `denied` (отказ автора или не выдана область), `state`, `no_channel`, `too_many`, `limit`, `disabled`,
        `unavailable`, `error`. Без входа — на `/login`.
      operationId: socialCallback
      tags: [social]
      parameters:
        - { name: platform, in: path, required: true, schema: { $ref: "#/components/schemas/SocialPlatform" } }
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303": { description: Переход в анкету с итогом }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/me/social/accounts/{id}/refresh:
    post:
      summary: Проверить аккаунт ещё раз сейчас
      description: Не чаще раза в 10 минут у подтверждённого (429 `rate_limited`). Доступ потерян — `failed` с причиной.
      operationId: refreshSocial
      tags: [social]
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Аккаунт после проверки
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account: { $ref: "#/components/schemas/SocialAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/me/social/accounts/{id}:
    delete:
      summary: Отвязать аккаунт
      description: Последний аккаунт доступа OAuth — токен отзывается у площадки и удаляется.
      operationId: unlinkSocial
      tags: [social]
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Отвязан }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/me/tasks/{id}/revision:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    delete:
      summary: Удалить правку опубликованного задания (опубликованное остаётся как было)
      operationId: discardTaskRevision
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Задание без правки, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/card/revision:
    delete:
      summary: Удалить правку опубликованной анкеты
      operationId: discardCardRevision
      tags: [cards]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Анкета без правки, content: { application/json: { schema: { $ref: "#/components/schemas/CardResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/notifications:
    get:
      summary: Уведомления в приложении (решения модератора и др.)
      description: Последние уведомления текущего пользователя, новые сверху, и счётчик непрочитанных. Появляются вместе с применением решения модератора (отложенно, в окне отмены 10 с).
      operationId: getNotifications
      tags: [notifications]
      security: [{ session: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 }, description: Сколько последних (по умолчанию 50) }
      responses:
        "200":
          description: Уведомления и счётчик непрочитанных
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/notifications/read:
    post:
      summary: Пометить уведомления прочитанными
      description: 'Тело {"id": N} — прочитать одно; пустое тело — все. Чужие и уже прочитанные игнорируются.'
      operationId: readNotifications
      tags: [notifications]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Прочитано }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/complaints:
    post:
      summary: Пожаловаться на задание, анкету или профиль
      description: Не на своё; до 20 в сутки (429 rate_limited, reason complaints_daily). Повтор открытой жалобы — 200, created=false.
      operationId: createComplaint
      tags: [complaints]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintInput" } } }
      responses:
        "201": { description: Жалоба принята, content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintCreated" } } } }
        "200": { description: Такая жалоба уже есть, content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintCreated" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: self_action — на своё, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/admin/me:
    get:
      summary: Админка — кто я, права, 2FA, справочники карточки проверки
      description: Доступно без подтверждения 2FA (по нему интерфейс ведёт на настройку или ввод кода). Не сотрудник — 404.
      operationId: adminMe
      tags: [admin]
      security: [{ session: [] }]
      responses:
        "200": { description: Сотрудник, content: { application/json: { schema: { $ref: "#/components/schemas/AdminMe" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/2fa/setup:
    post:
      summary: Новый секрет TOTP и QR-код (пока 2FA не включена)
      operationId: adminTwoFactorSetup
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Секрет, content: { application/json: { schema: { $ref: "#/components/schemas/TwoFactorSetup" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/admin/2fa/confirm:
    post:
      summary: Первый код из приложения — 2FA включена, резервные коды (показываются один раз)
      operationId: adminTwoFactorConfirm
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CodeInput" } } } }
      responses:
        "200": { description: Резервные коды, content: { application/json: { schema: { $ref: "#/components/schemas/BackupCodes" } } } }
        "400": { description: 2fa_invalid — неверный код, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/admin/2fa/verify:
    post:
      summary: Подтвердить вход в админку кодом или резервным кодом (на 12 часов)
      description: Повтор того же кода не проходит; 5 неверных подряд — блокировка на 15 минут (429, reason 2fa_locked).
      operationId: adminTwoFactorVerify
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CodeInput" } } } }
      responses:
        "204": { description: Подтверждено }
        "400": { description: 2fa_invalid, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: 2fa_setup_required, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/admin/2fa/backup-codes:
    post:
      summary: Новые резервные коды (прежние перестают действовать)
      operationId: adminBackupCodes
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Резервные коды, content: { application/json: { schema: { $ref: "#/components/schemas/BackupCodes" } } } }
        "403": { $ref: "#/components/responses/AdminForbidden" }
  /api/admin/dashboard:
    get:
      summary: Сводка — очередь по видам, решения за сегодня и неделю, среднее время проверки, новые пользователи
      operationId: adminDashboard
      tags: [admin]
      security: [{ session: [] }]
      responses:
        "200": { description: Сводка, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/queue:
    get:
      summary: Очередь проверки (без взятых другими и без ждущих применения решений)
      operationId: adminQueue
      tags: [admin]
      security: [{ session: [] }]
      parameters:
        - { name: type, in: query, schema: { type: array, items: { $ref: "#/components/schemas/ReviewKind" } }, explode: true }
        - { name: category, in: query, schema: { type: array, items: { type: string } }, explode: true }
        - { name: city, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [oldest, newest] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: Очередь, content: { application/json: { schema: { $ref: "#/components/schemas/Queue" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
  /api/admin/queue/next:
    post:
      summary: Взять следующий по отбору (skip — текущий, отпускается)
      operationId: adminQueueNext
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NextInput" } } } }
      responses:
        "200": { description: Взят в работу, content: { application/json: { schema: { $ref: "#/components/schemas/QueueItem" } } } }
        "204": { description: Очередь пуста }
        "403": { $ref: "#/components/responses/AdminForbidden" }
  /api/admin/review/{kind}/{id}:
    parameters:
      - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/ReviewKind" } }
      - { name: id, in: path, required: true, schema: { type: string }, description: "id задания, автора, категории или ключ формата" }
    get:
      summary: Карточка проверки — как увидят пользователи, все поля, фото, соцсети, история владельца
      operationId: adminReviewItem
      tags: [admin]
      security: [{ session: [] }]
      responses:
        "200": { description: Карточка, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewItem" } } } }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/review/{kind}/{id}/claim:
    parameters:
      - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/ReviewKind" } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Взять в работу на 10 минут (своё — продлить)
      operationId: adminClaim
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Аренда, content: { application/json: { schema: { $ref: "#/components/schemas/Lease" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: lease_held — у другого модератора, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/admin/review/{kind}/{id}/release:
    parameters:
      - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/ReviewKind" } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Отпустить
      operationId: adminRelease
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Отпущено }
  /api/admin/review/{kind}/{id}/decision:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [task, task_revision, card, card_revision] } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Решение — применится через 10 с (до этого — отмена); затем уведомление владельцу (почта + Telegram)
      operationId: adminDecide
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DecisionInput" } } } }
      responses:
        "202": { description: Принято, ждёт применения, content: { application/json: { schema: { $ref: "#/components/schemas/Decision" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: "lease_held | lease_lost | wrong_status", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/admin/decisions/{id}/undo:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    post:
      summary: Отменить своё решение в течение 10 с
      operationId: adminUndo
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Отменено, content: { application/json: { schema: { $ref: "#/components/schemas/Decision" } } } }
        "409": { description: undo_expired, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/admin/categories/{id}/decision:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    post:
      summary: Своя категория — одобрить в общие, объединить с общей, отклонить
      operationId: adminCategoryDecision
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, merge, reject] }
                into: { type: string, description: slug общей категории (merge) }
                reason: { type: string, description: причина (reject) }
      responses:
        "204": { description: Решено }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/formats/decision:
    post:
      summary: Свой формат — одобрить в общие подсказки, объединить с форматом из списка, отклонить
      operationId: adminFormatDecision
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [norm, action]
              properties:
                norm: { type: string, description: ключ формата из очереди }
                action: { type: string, enum: [approve, merge, reject] }
                into: { type: string }
      responses:
        "204": { description: Решено }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/complaints:
    get:
      summary: Очередь жалоб — предметы с открытыми жалобами, старые первыми
      operationId: adminComplaints
      tags: [admin]
      security: [{ session: [] }]
      parameters:
        - { name: subject, in: query, schema: { type: string, enum: [task, creator_card, user] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: Жалобы, content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintGroups" } } } }
        "403": { $ref: "#/components/responses/AdminForbidden" }
  /api/admin/complaints/{subject}/{id}:
    parameters:
      - { name: subject, in: path, required: true, schema: { type: string, enum: [task, creator_card, user] } }
      - { $ref: "#/components/parameters/TaskID" }
    get:
      summary: Жалобы на предмет и сам предмет
      operationId: adminComplaintCase
      tags: [admin]
      security: [{ session: [] }]
      responses:
        "200": { description: Жалобы, content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintCase" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/complaints/{subject}/{id}/resolve:
    parameters:
      - { name: subject, in: path, required: true, schema: { type: string, enum: [task, creator_card, user] } }
      - { $ref: "#/components/parameters/TaskID" }
    post:
      summary: Решение по жалобам — отклонить (dismiss), снять с публикации (hide), заблокировать владельца (block)
      operationId: adminResolveComplaints
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [dismiss, hide, block] }
                note: { type: string, description: "Причина (для hide и block — 5–500 символов, её увидит владелец)" }
      responses:
        "200": { description: Закрыто жалоб, content: { application/json: { schema: { type: object, required: [closed], properties: { closed: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/users:
    get:
      summary: Поиск пользователей (id, почта, имя, названия профилей)
      operationId: adminUsers
      tags: [admin]
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: staff, in: query, schema: { type: string, enum: ["1"] } }
        - { name: blocked, in: query, schema: { type: string, enum: ["1"] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Пользователи
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } } } }
        "403": { $ref: "#/components/responses/AdminForbidden" }
  /api/admin/users/{id}:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    get:
      summary: Карточка пользователя — профили, способы входа, задания, анкета, соцсети, входы, решения, жалобы
      operationId: adminUserCard
      tags: [admin]
      security: [{ session: [] }]
      responses:
        "200": { description: Карточка, content: { application/json: { schema: { $ref: "#/components/schemas/UserCard" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/users/{id}/block:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    post:
      summary: Заблокировать — вход закрыт, все сеансы завершены, контент скрыт (сотрудника — только администратор)
      operationId: adminBlockUser
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReasonInput" } } } }
      responses:
        "200": { description: Заблокирован, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "409": { description: "wrong_status | self_action | last_admin", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/admin/users/{id}/unblock:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    post:
      summary: Разблокировать
      operationId: adminUnblockUser
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReasonInput" } } } }
      responses:
        "200": { description: Разблокирован, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/users/{id}/role:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    put:
      summary: Назначить модератором или администратором или снять роль (только администратор)
      operationId: adminSetRole
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string, enum: ["", moderator, admin] } } } } }
      responses:
        "200": { description: Роль, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "409": { description: "self_action | last_admin", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/admin/users/{id}/reset-2fa:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    post:
      summary: Сбросить 2FA сотрудника (потерян телефон) — только администратор
      operationId: adminResetTwoFactor
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Сброшено }
        "403": { $ref: "#/components/responses/AdminForbidden" }
  /api/admin/audit:
    get:
      summary: Журнал действий (только администратор), новые сверху; записи не изменяются и не удаляются
      operationId: adminAudit
      tags: [admin]
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: integer, format: int64 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: before, in: query, schema: { type: integer, format: int64 }, description: курсор — id последней записи }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: Записи, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
        "403": { $ref: "#/components/responses/AdminForbidden" }
  /api/admin/settings:
    get:
      summary: Настройки (только администратор)
      operationId: adminSettings
      tags: [admin]
      security: [{ session: [] }]
      responses:
        "200": { description: Настройки, content: { application/json: { schema: { $ref: "#/components/schemas/AdminSettings" } } } }
        "403": { $ref: "#/components/responses/AdminForbidden" }
    put:
      summary: Режим проверки — auto | manual (хранится в базе; MODERATION_MODE — значение по умолчанию)
      operationId: adminSetSettings
      tags: [admin]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [moderationMode], properties: { moderationMode: { type: string, enum: [auto, manual] } } } } }
      responses:
        "200": { description: Настройки, content: { application/json: { schema: { $ref: "#/components/schemas/AdminSettings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
  /api/me/pages/{kind}:
    parameters: [{ $ref: "#/components/parameters/PageKind" }]
    get:
      summary: Моя страница бизнеса или профиль автора (page null — ещё нет; suggestedSlug — адрес новой)
      operationId: getMyPage
      tags: [pages]
      security: [{ session: [] }]
      parameters:
        - { name: name, in: query, schema: { type: string, maxLength: 200 }, description: Название из профиля — для адреса новой страницы }
      responses:
        "200": { description: Страница, content: { application/json: { schema: { $ref: "#/components/schemas/PageResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Сохранить черновик страницы (у опубликованной — правку; опубликованная видна до одобрения)
      description: |
        Блоки по виду страницы. Бизнес — about, photos, video, contacts, facts, text; автор — about, channels (подтверждённые
        соцсети — сами), topics, works, reviews (заглушка до сделок), card (анкета — сама), text, photos, video, facts.
        Одиночные — about, contacts, channels, topics, works, reviews, card. До 20 блоков, 60 фото и 5 видео на странице.
        Видео — файлом (`media` из `POST /api/me/media/video`, `poster` — фото назначения `video_poster`) или ссылкой
        `url` на YouTube / VK Видео (только белый список; адрес для встраивания строит сервер). Новая страница получает
        `slug` (если свободен) или адрес из названия. Ошибки блока — `blocks.<n>`.
      operationId: saveMyPage
      tags: [pages]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PageInput" } } } }
      responses:
        "200": { description: Сохранено, content: { application/json: { schema: { $ref: "#/components/schemas/PageResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/pages/{kind}/slug:
    parameters: [{ $ref: "#/components/parameters/PageKind" }]
    put:
      summary: Сменить адрес страницы (латиница, цифры, дефис, 3–40; прежний ведёт на новый; до 10 адресов)
      operationId: setPageSlug
      tags: [pages]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [slug], additionalProperties: false, properties: { slug: { type: string } } } } }
      responses:
        "200": { description: Адрес сменён, content: { application/json: { schema: { $ref: "#/components/schemas/PageResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/me/pages/{kind}/submit:
    parameters: [{ $ref: "#/components/parameters/PageKind" }]
    post:
      summary: Отправить страницу (или её правку) на проверку; MODERATION_MODE=auto — сразу published
      description: Обязательно — название (имя), город, хотя бы одна сфера (тема) и хотя бы один блок с содержимым.
      operationId: submitMyPage
      tags: [pages]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: На проверке или опубликовано, content: { application/json: { schema: { $ref: "#/components/schemas/PageResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/pages/{kind}/withdraw:
    parameters: [{ $ref: "#/components/parameters/PageKind" }]
    post:
      summary: В черновик (с проверки или снять с публикации; неотправленная правка становится черновиком)
      operationId: withdrawMyPage
      tags: [pages]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Черновик, content: { application/json: { schema: { $ref: "#/components/schemas/PageResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/pages/{kind}/revision:
    parameters: [{ $ref: "#/components/parameters/PageKind" }]
    delete:
      summary: Удалить правку опубликованной страницы
      operationId: discardPageRevision
      tags: [pages]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Страница без правки, content: { application/json: { schema: { $ref: "#/components/schemas/PageResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/pages/{kind}/{slug}:
    parameters:
      - { $ref: "#/components/parameters/PageKind" }
      - { name: slug, in: path, required: true, schema: { type: string, maxLength: 64 } }
    get:
      summary: Опубликованная страница для всех (без входа)
      description: |
        Прежний адрес — `{movedTo}` (нынешний; сайт отвечает 301). Бизнес — с открытыми заданиями (`tasks`), автор — с
        подтверждёнными соцсетями (`platforms`) и анкетой (`card`, если на странице есть блок «Анкета»). Кэш 30 с.
      operationId: getPublicPage
      tags: [pages]
      responses:
        "200": { description: Страница или новый адрес, content: { application/json: { schema: { $ref: "#/components/schemas/PublicPage" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/me/media/video:
    post:
      summary: Загрузить видео для страницы (MP4 или WebM как есть, без перекодирования)
      description: |
        multipart/form-data, поле `file`. Тип — по содержимому; до `VIDEO_MAX_MB` (50) МБ, в квоте фото пользователя;
        одновременно — 2 загрузки на сервер (иначе 503 `busy`). Кадр-заставку сайт снимает сам и грузит как фото
        `video_poster`. Неприкреплённое удаляется через сутки.
      operationId: uploadVideo
      tags: [media]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "201": { description: Загружено, content: { application/json: { schema: { $ref: "#/components/schemas/Video" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Больше VIDEO_MAX_MB (video_too_large), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: Не MP4 / WebM (video_type), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /media/{id}/video:
    get:
      summary: Файл видео (Range — перемотка)
      description: Опубликованное — всем с долгим кэшем; остальное — владельцу; чужое закрытое — 404.
      operationId: getVideo
      tags: [media]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" } }
        - { name: Range, in: header, schema: { type: string } }
      responses:
        "200": { description: Видео, content: { video/mp4: { schema: { type: string, format: binary } }, video/webm: { schema: { type: string, format: binary } } } }
        "206": { description: Часть файла }
        "404": { description: Нет или нет доступа }
  /media/{id}/{size}.webp:
    get:
      summary: Файл фото
      description: |
        Аватар профиля и фото опубликованных заданий и анкет — всем (`public, max-age=31536000, immutable`);
        остальное — только владельцу (`private`), чужое закрытое — 404. ETag — id и размер (304 по If-None-Match).
      operationId: getMedia
      tags: [media]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" } }
        - { name: size, in: path, required: true, schema: { type: integer, enum: [320, 800, 1600] } }
      responses:
        "200":
          description: WebP
          content:
            image/webp:
              schema: { type: string, format: binary }
        "304": { description: Не изменилось }
        "404": { description: Нет или нет доступа }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: ohvat_session }
  parameters:
    PageKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [business, creator] }
      description: business — страница бизнеса /b/<slug>, creator — профиль автора /c/<slug>
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: Значение из `GET /api/auth/config` (равно cookie `ohvat_csrf`)
    TaskID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    LoggedIn:
      description: Вошли — cookie сессии установлена
      headers:
        Set-Cookie: { schema: { type: string }, description: "ohvat_session=…; HttpOnly; Secure; SameSite=Lax; Path=/" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LoginResult" }
    BadRequest:
      description: "bad_request | validation (fields) | telegram_invalid"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: csrf — нет или неверный CSRF-токен, чужой Origin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: unauthorized — нет сессии
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooMany:
      description: "rate_limited (retryAfter) | too_many_attempts"
      headers:
        Retry-After: { schema: { type: integer }, description: Секунд до следующей попытки }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: not_found — нет или чужое
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "wrong_status — статус уже другой | tasks_limit | media_quota"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminForbidden:
      description: "forbidden — нет права | 2fa_setup_required | 2fa_required"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: "provider_disabled | mail_unavailable"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: internal, description: Машинный код ошибки }
            message: { type: string, example: Что-то пошло не так. Попробуйте позже., description: Понятный текст для человека }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Ошибки полей формы (code=validation)
            retryAfter: { type: integer, description: Секунд до повтора (code=rate_limited) }
            attemptsLeft: { type: integer, description: Осталось попыток ввода кода (code_invalid, too_many_attempts) }
    Home:
      type: object
      required: [categories, businessPlans, creatorPlans, faq]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        businessPlans:
          type: array
          description: Тарифы бизнеса по возрастанию цены
          items: { $ref: "#/components/schemas/Plan" }
        creatorPlans:
          type: array
          description: Тарифы авторов по возрастанию цены
          items: { $ref: "#/components/schemas/Plan" }
        faq:
          type: array
          items: { $ref: "#/components/schemas/Question" }
    Category:
      type: object
      required: [slug, title, icon]
      properties:
        slug: { type: string, example: food }
        title: { type: string, example: Еда и кафе }
        icon: { type: string, description: Имя иконки Lucide, example: coffee }
    Plan:
      type: object
      required: [slug, audience, name, subtitle, priceKopecks, priceText, period, recommended, features, cta]
      properties:
        slug: { type: string, example: pro }
        audience: { type: string, enum: [business, creator] }
        name: { type: string, example: Про }
        subtitle: { type: string, example: Для регулярной рекламы }
        priceKopecks: { type: integer, format: int64, minimum: 0, example: 300000 }
        priceText: { type: string, description: Цена для показа (неразрывные пробелы), example: "3 000 ₽" }
        period: { type: string, enum: [month], description: Период оплаты }
        recommended: { type: boolean }
        features:
          type: array
          items: { type: string }
        cta: { type: string, description: Подпись кнопки, example: Выбрать Про }
    Question:
      type: object
      required: [id, question, answer]
      properties:
        id: { type: integer, format: int64 }
        question: { type: string }
        answer: { type: string }
    Mode:
      type: string
      enum: [business, creator]
      description: Режим аккаунта — один аккаунт может быть и бизнесом, и автором
    AuthConfig:
      type: object
      required: [email, google, telegram, csrfToken]
      properties:
        email: { type: boolean, description: Вход по почте доступен }
        google: { type: boolean, description: Ключи Google заданы — показывать кнопку }
        telegram:
          nullable: true
          description: null — бот не подключён, кнопка скрыта
          type: object
          required: [botId, botName, bot]
          properties:
            botId: { type: string, description: Числовой id бота для Telegram Login (запасной способ — окно-виджет) }
            botName: { type: string, description: Имя бота без @ }
            bot: { type: boolean, description: Вход через бота доступен (основной способ) }
        csrfToken: { type: string }
    EmailStart:
      type: object
      required: [email, consent]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254, example: anna@mail.ru }
        consent: { type: boolean, description: Согласие на обработку персональных данных — должно быть true }
    CodeSent:
      type: object
      required: [email, resendAfter, expiresIn]
      properties:
        email: { type: string }
        resendAfter: { type: integer, example: 60, description: Секунд до «Отправить ещё раз» }
        expiresIn: { type: integer, example: 600, description: Срок кода, секунд }
    EmailVerify:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email: { type: string, example: anna@mail.ru }
        code: { type: string, pattern: "^[0-9]{6}$" }
    TelegramLogin:
      type: object
      required: [user, consent]
      additionalProperties: false
      properties:
        consent: { type: boolean }
        user:
          type: object
          description: Объект из Telegram Login как есть (id, first_name, last_name, username, photo_url, auth_date, hash)
          additionalProperties: true
    BotStart:
      type: object
      required: [consent]
      additionalProperties: false
      properties:
        consent: { type: boolean }
    BotLink:
      type: object
      required: [url, expiresIn]
      properties:
        url: { type: string, example: "https://t.me/reklama_auth_bot?start=login_AbC…" }
        expiresIn: { type: integer, example: 300, description: Срок ссылки, секунд }
    BotStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, ok] }
        user: { $ref: "#/components/schemas/User" }
        next: { type: string, enum: [/app] }
        created: { type: boolean }
    ModeInput:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { $ref: "#/components/schemas/Mode" }
    BasicsInput:
      type: object
      required: [name, city]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80, description: Как вас называть }
        city: { type: string, minLength: 2, maxLength: 80 }
    BusinessProfileInput:
      type: object
      required: [name, city, spheres]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80, description: Название компании или бренда }
        city: { type: string, minLength: 2, maxLength: 80 }
        spheres: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: slug тем }
    CreatorProfileInput:
      type: object
      required: [name, city, spheres, channels]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80, description: Имя или псевдоним }
        city: { type: string, minLength: 2, maxLength: 80 }
        spheres: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: Темы (slug) }
        channels: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: https://… или @имя }
    BusinessProfile:
      type: object
      required: [name, city, spheres, updatedAt]
      properties:
        name: { type: string }
        city: { type: string }
        spheres: { type: array, items: { type: string } }
        updatedAt: { type: string, format: date-time }
    CreatorProfile:
      type: object
      required: [name, city, spheres, channels, updatedAt]
      properties:
        name: { type: string }
        city: { type: string }
        spheres: { type: array, items: { type: string } }
        channels: { type: array, items: { type: string } }
        updatedAt: { type: string, format: date-time }
    BusinessProfileResult:
      type: object
      required: [profile]
      properties:
        profile:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BusinessProfile" }]
    CreatorProfileResult:
      type: object
      required: [profile]
      properties:
        profile:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CreatorProfile" }]
    User:
      type: object
      required: [id, name, email, avatarUrl, city, mode, onboarded]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, nullable: true }
        avatarUrl: { type: string }
        city: { type: string }
        mode: { $ref: "#/components/schemas/Mode" }
        onboarded: { type: boolean, description: Общие данные профиля сохранялись }
        staffRole: { $ref: "#/components/schemas/AdminRole" }
    LoginResult:
      type: object
      required: [user, next, created]
      properties:
        user: { $ref: "#/components/schemas/User" }
        next: { type: string, enum: [/app], description: Куда перейти }
        created: { type: boolean, description: Аккаунт создан этим входом }
    Step:
      type: object
      required: [key, done]
      properties:
        key: { type: string, enum: [basics, profile, telegram], description: "Общие данные | профиль активного режима | Telegram привязан" }
        done: { type: boolean }
    Me:
      type: object
      required: [user, providers, profiles, checklist, completion]
      properties:
        user: { $ref: "#/components/schemas/User" }
        providers:
          type: array
          items: { type: string, enum: [email, telegram, google] }
        profiles:
          type: object
          required: [business, creator]
          description: Какие профили режимов заполнены
          properties:
            business: { type: boolean }
            creator: { type: boolean }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/Step" }
        completion: { type: integer, minimum: 0, maximum: 100, description: "Прогресс заполнения для активного режима, %" }
    Status:
      type: string
      enum: [draft, pending_review, published, rejected, expired, changes_requested]
      description: "Черновик | на проверке | опубликовано | отклонено (с причиной) | завершено (срок публикации прошёл, только задания) | на доработке (замечания в reviewNotes)"
    Block:
      type: object
      required: [kind, title, items]
      additionalProperties: false
      description: "Динамический блок: text — абзацы, list — пункты, links — ссылки https://…"
      properties:
        kind: { type: string, enum: [text, list, links] }
        title: { type: string, maxLength: 60 }
        items: { type: array, maxItems: 15, items: { type: string, maxLength: 1000 } }
    Photo:
      type: object
      required: [id, thumb, src, large]
      properties:
        id: { type: string }
        thumb: { type: string, description: "320 px" }
        src: { type: string, description: "800 px" }
        large: { type: string, description: "1600 px" }
    TaskFormat:
      type: string
      enum: [reels, shorts, youtube, vk_clips, tiktok, telegram]
      description: Форматы списка (отбор ленты)
    FormatItem:
      type: object
      required: [id, title, builtin, own]
      properties:
        id: { type: string, description: "slug формата списка или название своего" }
        title: { type: string }
        builtin: { type: boolean }
        own: { type: boolean, description: Уже использован бизнесом }
    TaskInput:
      type: object
      required: [title, city, nationwide, categories, formats, access, minViews, rewardKopecks, publishBy, publishTime, blocks, cover, photos]
      additionalProperties: false
      description: Черновик может быть неполным; ограничения формы проверяются всегда, обязательность — при отправке.
      properties:
        title: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 80 }
        nationwide: { type: boolean, description: "«Вся Россия»" }
