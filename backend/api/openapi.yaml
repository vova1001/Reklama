openapi: 3.0.3
info:
  title: Охват API
  version: 0.8.0
  description: |
    API площадки «Охват»: данные главной, регистрация и вход (почта с кодом, Telegram, Google), приложение после входа:
    один аккаунт — два режима («Бизнес» и «Автор»), профили режимов заполняются, когда понадобятся.
    Все ответы — JSON в UTF-8. Ошибки — в едином формате `Error`.

    Сессия — httpOnly cookie `ohvat_session` (Secure на https, SameSite=Lax), в базе только SHA-256 токена.
    CSRF: все POST/PUT/PATCH требуют заголовок `X-CSRF-Token`, равный cookie `ohvat_csrf` (токен выдаёт `GET /api/auth/config`),
    и Origin, совпадающий с адресом сайта (PUBLIC_URL).

    Ограничение частоты (токен-бакеты; память процесса или Redis по `REDIS_URL`): весь `/api` — на адрес
    (`RATE_LIMIT_API_*`); вход `/api/auth/*` (кроме config и logout) — строже, на адрес (`RATE_LIMIT_*`);
    `/api/me*` — на пользователя (`RATE_LIMIT_USER_*`); вебхук бота — общий лимит (`TELEGRAM_WEBHOOK_*`).
    Превышение — 429 `rate_limited` с заголовком `Retry-After`. Загрузка фото — ещё и по пользователю
    (`RATE_LIMIT_UPLOAD_*`).

    Задания бизнеса и анкеты авторов проходят модерацию: `draft` → `pending_review` → `published` | `rejected`
    (с причиной). Черновик сохраняется неполным; полноту сервер проверяет при отправке на проверку
    (ошибки — в `fields`, у блоков и площадок — `blocks.<n>`, `platforms.<n>`). Отправок на проверку — до
    `MODERATION_SUBMITS_PER_DAY` в сутки (429 `rate_limited`), заданий — до `TASKS_MAX_PER_USER` (409 `tasks_limit`).
    Решение модератора — сервисный метод (админки пока нет); каждая смена статуса пишется в журнал.
    `MODERATION_MODE=auto` (по умолчанию) — отправленное сразу публикуется: в журнале «на проверке» от владельца и
    «опубликовано» от системы с пометкой «одобрено автоматически», ответ отправки — уже `published`;
    `manual` — ждёт модератора. Опубликованное владелец может снять в черновик (`…/withdraw`), чтобы изменить.
servers:
  - url: http://localhost:8000
paths:
  /healthz:
    get:
      summary: Живость сервера и базы
      operationId: health
      responses:
        "200":
          description: Сервер и база работают
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: База недоступна
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/home:
    get:
      summary: Данные главной страницы
      description: Темы, тарифы бизнеса и авторов, частые вопросы — одним запросом.
      operationId: getHome
      responses:
        "200":
          description: Данные главной
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=60" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/config:
    get:
      summary: Способы входа и CSRF-токен
      description: Ставит cookie `ohvat_csrf` (если её нет) и возвращает тот же токен для заголовка `X-CSRF-Token`.
      operationId: getAuthConfig
      tags: [auth]
      responses:
        "200":
          description: Включённые способы входа
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /api/auth/email/start:
    post:
      summary: Отправить код на почту
      description: |
        Код — 6 цифр, действует 10 минут, 5 попыток; в базе только HMAC. Новый код гасит прежние.
        Лимиты: одно письмо на почту в 60 с, 5 писем на почту в час, 20 писем с адреса в час.
      operationId: startEmail
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailStart" }
      responses:
        "202":
          description: Письмо поставлено в отправку
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeSent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/auth/email/verify:
    post:
      summary: Проверить код и войти
      operationId: verifyEmail
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailVerify" }
      responses:
        "200": { $ref: "#/components/responses/LoggedIn" }
        "400":
          description: "validation | code_invalid (attemptsLeft) | code_expired"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/auth/telegram:
    post:
      summary: Вход через Telegram
      description: Данные Telegram Login как есть; подпись HMAC-SHA256 по токену бота, auth_date не старше часа.
      operationId: loginTelegram
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramLogin" }
      responses:
        "200": { $ref: "#/components/responses/LoggedIn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/auth/telegram/bot/start:
    post:
      summary: Вход через бота — ссылка на бота
      description: |
        Одноразовый токен (в базе — SHA-256) в ссылке `https://t.me/<бот>?start=login_<токен>`, срок — TELEGRAM_LOGIN_TTL_MIN
        (5 мин). Секрет браузера — в httpOnly-cookie `ohvat_tglogin` (Path=/api/auth/telegram/bot): забрать вход может только
        этот браузер. Лимит — TELEGRAM_LOGIN_PER_IP_HOUR запусков с адреса в час.
      operationId: startTelegramBot
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BotStart" }
      responses:
        "201":
          description: Ссылка на бота
          headers:
            Set-Cookie: { schema: { type: string }, description: "ohvat_tglogin=…; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/telegram/bot" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/auth/telegram/bot/status:
    post:
      summary: Вход через бота — ждать подтверждения (long-poll до 25 с)
      description: |
        По cookie `ohvat_tglogin`. Подтверждено в боте — сессия (`status: ok`, cookie `ohvat_session`), иначе по истечении
        ожидания `status: pending` — запросить снова. Вход забирается один раз.
      operationId: waitTelegramBot
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: pending — ещё ждём; ok — вошли
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410":
          description: "login_expired — ссылка устарела или уже использована | login_cancelled — «Это не я» в боте"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/telegram/webhook:
    post:
      summary: Вебхук бота Telegram
      description: |
        Обновления Telegram (message, callback_query, my_chat_member). Без CSRF; заголовок
        `X-Telegram-Bot-Api-Secret-Token` = TELEGRAM_WEBHOOK_SECRET. Вебхук ставится при старте сервера
        (setWebhook на ${PUBLIC_URL}/api/telegram/webhook). Повтор одного update_id обрабатывается один раз.
      operationId: telegramWebhook
      tags: [telegram]
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: Update из Bot API }
      responses:
        "200": { description: Принято (или не нужно боту) }
        "401": { description: Секрет не совпал }
        "404": { description: Бот не подключён }
        "500": { description: Сбой — Telegram повторит }
        "503": { description: Перегрузка — Telegram повторит }
  /api/auth/google/start:
    get:
      summary: Переход ко входу через Google
      description: |
        OAuth 2.0 Authorization Code + PKCE (S256) + state. state и verifier — в httpOnly cookie `ohvat_oauth`
        на 10 минут. Ошибки — переход на `/login?error=google_off|consent|google`.
      operationId: startGoogle
      tags: [auth]
      parameters:
        - { name: consent, in: query, required: true, schema: { type: string, enum: ["1"] }, description: Согласие на обработку данных }
      responses:
        "302": { description: Переход в Google }
        "303": { description: Ошибка — переход на страницу входа с кодом ошибки }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/auth/google/callback:
    get:
      summary: Возврат из Google
      description: |
        Сверка state, обмен кода (с verifier), вход. Успех — переход в приложение `/app`;
        ошибка — `/login?error=google|google_state|google_cancel`.
      operationId: googleCallback
      tags: [auth]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303": { description: Переход в приложение или на страницу входа }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/auth/logout:
    post:
      summary: Выйти
      description: Сессия удаляется в базе, cookie стирается.
      operationId: logout
      tags: [auth]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Вышли }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/me:
    get:
      summary: Кто вошёл
      description: Общие данные, активный режим, способы входа, какие профили режимов заполнены и прогресс заполнения.
      operationId: getMe
      tags: [account]
      security: [{ session: [] }]
      responses:
        "200":
          description: Пользователь, режим и профили
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/mode:
    patch:
      summary: Переключить режим «Бизнес / Автор»
      description: Профиль режима заполнять не обязательно — приложение мягко подскажет.
      operationId: switchMode
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeInput" }
      responses:
        "200":
          description: Режим включён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/profile:
    put:
      summary: Общие данные профиля
      description: Как вас называть и город — 2–80 символов. Первое сохранение отмечает `onboarded`.
      operationId: saveBasics
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BasicsInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/profile/business:
    get:
      summary: Профиль режима «Бизнес»
      operationId: getBusinessProfile
      tags: [account]
      security: [{ session: [] }]
      responses:
        "200":
          description: Профиль (null — ещё не заполнен)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfileResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
    put:
      summary: Сохранить профиль бизнеса
      description: Название и город — 2–80 символов; 1–5 сфер из справочника (`categories.slug`).
      operationId: saveBusinessProfile
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessProfileInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfileResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/profile/creator:
    get:
      summary: Профиль режима «Автор»
      operationId: getCreatorProfile
      tags: [account]
      security: [{ session: [] }]
      responses:
        "200":
          description: Профиль (null — ещё не заполнен)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorProfileResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
    put:
      summary: Сохранить профиль автора
      description: |
        Имя и город — 2–80 символов; 1–5 тем из справочника; 1–5 каналов (https://… или @имя; http повышается до https).
      operationId: saveCreatorProfile
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatorProfileInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorProfileResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/logout-all:
    post:
      summary: Выйти на всех устройствах
      description: Все сеансы аккаунта удаляются (включая этот), cookie стирается.
      operationId: logoutAll
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: Завершено сеансов
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/tasks:
    get:
      summary: Лента опубликованных заданий
      description: |
        Новые сверху. Курсор `next` из ответа — в параметр `cursor` следующего запроса. Отбор (пусто — без отбора):
        любая из сфер (`category` повторяется, до 5), город (без регистра; задания «Вся Россия» подходят любому городу),
        любой из форматов списка (`format` повторяется). Неверный отбор — 400 с `fields`.
      operationId: getFeed
      tags: [tasks]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: category, in: query, style: form, explode: true, schema: { type: array, maxItems: 5, items: { type: string } }, description: slug сфер }
        - { name: city, in: query, schema: { type: string, maxLength: 80 } }
        - { name: format, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/TaskFormat" } } }
      responses:
        "200":
          description: Страница ленты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    get:
      summary: Опубликованное задание
      description: Страница задания для всех. Не опубликовано или нет — 404.
      operationId: getPublicTask
      tags: [tasks]
      responses:
        "200":
          description: Задание (с `brand` и `categoryTitles`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/cards:
    get:
      summary: Лента опубликованных анкет авторов
      description: Только после входа. Новые сверху, курсор — как у заданий. Отбор — тема и город (без регистра).
      operationId: getCardFeed
      tags: [cards]
      security: [{ session: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: topic, in: query, style: form, explode: true, schema: { type: array, maxItems: 5, items: { type: string } }, description: slug тем — любая из них }
        - { name: city, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Страница ленты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardFeed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/cards/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: id автора (`Card.id`) }
    get:
      summary: Опубликованная анкета автора
      operationId: getPublicCard
      tags: [cards]
      security: [{ session: [] }]
      responses:
        "200":
          description: Анкета (с `topicTitles`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/me/tasks:
    get:
      summary: Мои задания (все статусы)
      operationId: listMyTasks
      tags: [tasks]
      security: [{ session: [] }]
      responses:
        "200":
          description: Задания, недавно изменённые сверху (до 100)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Новый черновик задания
      operationId: createTask
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    get:
      summary: Моё задание
      operationId: getMyTask
      tags: [tasks]
      security: [{ session: [] }]
      responses:
        "200":
          description: Задание
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Сохранить черновик (или правку отклонённого)
      operationId: updateTask
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Удалить черновик или отклонённое
      operationId: deleteTask
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/tasks/{id}/submit:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    post:
      summary: Отправить на проверку
      description: |
        Из `draft` или `rejected` в `pending_review` (при `MODERATION_MODE=auto` — сразу `published`). Обязательно:
        название 5–100, город (или «Вся Россия»), сфера, формат, просмотры, оплата от 100 ₽, срок — от
        завтра до 90 дней (по Москве), хотя бы один блок с пунктами (заголовок блока — по желанию).
      operationId: submitTask
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: На проверке или опубликовано (auto)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/tasks/{id}/withdraw:
    parameters: [{ $ref: "#/components/parameters/TaskID" }]
    post:
      summary: Вернуть в черновик (с проверки или снять с публикации)
      operationId: withdrawTask
      tags: [tasks]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: Черновик
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/card:
    get:
      summary: Моя анкета автора
      operationId: getCard
      tags: [cards]
      security: [{ session: [] }]
      responses:
        "200":
          description: Анкета (null — ещё нет)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Сохранить черновик анкеты
      operationId: saveCard
      tags: [cards]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/card/submit:
    post:
      summary: Отправить анкету на проверку
      description: |
        Обязательно — имя, город, 1–5 тем (своих — до 3), площадки с подписчиками. Блоки и фото — по желанию.
        При `MODERATION_MODE=auto` — сразу `published`.
      operationId: submitCard
      tags: [cards]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: На проверке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/me/card/withdraw:
    post:
      summary: Вернуть анкету в черновик (с проверки или снять с публикации)
      operationId: withdrawCard
      tags: [cards]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: Черновик
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/me/drafts/{form}:
    parameters:
      - { name: form, in: path, required: true, schema: { type: string, pattern: "^(task-new|task-[1-9][0-9]{0,17}|card)$" } }
    get:
      summary: Черновик формы редактора
      description: Состояние формы как есть (Redis, запасное — PostgreSQL; 7 дней с последнего сохранения).
      operationId: getDraft
      tags: [drafts]
      security: [{ session: [] }]
      responses:
        "200":
          description: Черновик (null — нет)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Сохранить черновик формы
      description: Тело — JSON-объект до `DRAFT_MAX_KB` (413 `draft_too_large`); частота — `RATE_LIMIT_DRAFT_*` (429).
      operationId: saveDraft
      tags: [drafts]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema:
                type: object
                required: [savedAt]
                properties:
                  savedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Черновик больше предела
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
    delete:
      summary: Удалить черновик формы
      operationId: deleteDraft
      tags: [drafts]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/me/categories:
    get:
      summary: Общие категории и свои
      operationId: listCategories
      tags: [categories]
      security: [{ session: [] }]
      responses:
        "200":
          description: Общий справочник и свои категории пользователя (на проверке и отклонённые)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Своя категория
      description: |
        2–40 символов, без ссылок и брани. Если такая уже есть (без учёта регистра, «ё» и пробелов) — общая или
        своя — вернётся она (`created: false`, 200). Новая — «на проверке» (201): сразу доступна автору в его
        задании и анкете, после модерации может стать общей. Своих на проверке — до 10, в одной анкете — до 3.
      operationId: createCategory
      tags: [categories]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 2, maxLength: 40 }
      responses:
        "200":
          description: Такая уже есть
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryCreated" }
        "201":
          description: Создана, на проверке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/me/categories/similar:
    get:
      summary: Похожие категории (подсказки при вводе)
      description: До 6 — общие и свои на проверке; совпадение, начало, вхождение, опечатка в 1–2 буквы.
      operationId: similarCategories
      tags: [categories]
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Подсказки
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CategoryItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/formats/similar:
    get:
      summary: Подсказки своего формата
      description: |
        До 6 похожих на запрос: форматы списка (`builtin`), известные и свои, уже использованные бизнесом (`own`).
        `id` выбранной подсказки передаётся в `TaskInput.formats` как есть.
      operationId: similarFormats
      tags: [tasks]
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Подсказки
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FormatItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/media:
    post:
      summary: Загрузить фото
      description: |
        `multipart/form-data`: `purpose`, `file`, необязательно `crop` — «x,y,w,h» в долях кадра (после поворота
        по EXIF). Тип — по содержимому: JPEG, PNG, WebP, HEIC (SVG, GIF и анимация — нет); до `MEDIA_MAX_MB`
        (10 МБ) и 40 Мп. Сервер удаляет метаданные (EXIF, геометки), поворачивает по EXIF, обрезает под
        пропорции назначения (аватар 1:1, обложка 16:9; без `crop` — по центру) и хранит WebP 320/800/1600.
        Неприкреплённое к заданию, анкете или профилю удаляется через сутки.
      operationId: uploadMedia
      tags: [media]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [purpose, file]
              properties:
                purpose: { $ref: "#/components/schemas/MediaPurpose" }
                crop: { type: string, example: "0.1,0,0.8,0.9" }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Загружено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: image_too_large — больше 10 МБ или 40 Мп
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: image_type — не JPEG/PNG/WebP/HEIC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503":
          description: busy — очередь обработки полна (Retry-After)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/me/media/{id}:
    delete:
      summary: Удалить своё неприкреплённое фото
      operationId: deleteMedia
      tags: [media]
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/me/avatar:
    put:
      summary: Аватар профиля
      description: "Из загруженного фото назначения `avatar`; `mediaId: null` — убрать."
      operationId: setAvatar
      tags: [account]
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId]
              additionalProperties: false
              properties:
                mediaId: { type: string, nullable: true }
      responses:
        "200":
          description: Адрес аватара ("" — убран)
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /media/{id}/{size}.webp:
    get:
      summary: Файл фото
      description: |
        Аватар профиля и фото опубликованных заданий и анкет — всем (`public, max-age=31536000, immutable`);
        остальное — только владельцу (`private`), чужое закрытое — 404. ETag — id и размер (304 по If-None-Match).
      operationId: getMedia
      tags: [media]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" } }
        - { name: size, in: path, required: true, schema: { type: integer, enum: [320, 800, 1600] } }
      responses:
        "200":
          description: WebP
          content:
            image/webp:
              schema: { type: string, format: binary }
        "304": { description: Не изменилось }
        "404": { description: Нет или нет доступа }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: ohvat_session }
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: Значение из `GET /api/auth/config` (равно cookie `ohvat_csrf`)
    TaskID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    LoggedIn:
      description: Вошли — cookie сессии установлена
      headers:
        Set-Cookie: { schema: { type: string }, description: "ohvat_session=…; HttpOnly; Secure; SameSite=Lax; Path=/" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LoginResult" }
    BadRequest:
      description: "bad_request | validation (fields) | telegram_invalid"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: csrf — нет или неверный CSRF-токен, чужой Origin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: unauthorized — нет сессии
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooMany:
      description: "rate_limited (retryAfter) | too_many_attempts"
      headers:
        Retry-After: { schema: { type: integer }, description: Секунд до следующей попытки }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: not_found — нет или чужое
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "wrong_status — статус уже другой | tasks_limit | media_quota"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: "provider_disabled | mail_unavailable"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: internal, description: Машинный код ошибки }
            message: { type: string, example: Что-то пошло не так. Попробуйте позже., description: Понятный текст для человека }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Ошибки полей формы (code=validation)
            retryAfter: { type: integer, description: Секунд до повтора (code=rate_limited) }
            attemptsLeft: { type: integer, description: Осталось попыток ввода кода (code_invalid, too_many_attempts) }
    Home:
      type: object
      required: [categories, businessPlans, creatorPlans, faq]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        businessPlans:
          type: array
          description: Тарифы бизнеса по возрастанию цены
          items: { $ref: "#/components/schemas/Plan" }
        creatorPlans:
          type: array
          description: Тарифы авторов по возрастанию цены
          items: { $ref: "#/components/schemas/Plan" }
        faq:
          type: array
          items: { $ref: "#/components/schemas/Question" }
    Category:
      type: object
      required: [slug, title, icon]
      properties:
        slug: { type: string, example: food }
        title: { type: string, example: Еда и кафе }
        icon: { type: string, description: Имя иконки Lucide, example: coffee }
    Plan:
      type: object
      required: [slug, audience, name, subtitle, priceKopecks, priceText, period, recommended, features, cta]
      properties:
        slug: { type: string, example: pro }
        audience: { type: string, enum: [business, creator] }
        name: { type: string, example: Про }
        subtitle: { type: string, example: Для регулярной рекламы }
        priceKopecks: { type: integer, format: int64, minimum: 0, example: 300000 }
        priceText: { type: string, description: Цена для показа (неразрывные пробелы), example: "3 000 ₽" }
        period: { type: string, enum: [month], description: Период оплаты }
        recommended: { type: boolean }
        features:
          type: array
          items: { type: string }
        cta: { type: string, description: Подпись кнопки, example: Выбрать Про }
    Question:
      type: object
      required: [id, question, answer]
      properties:
        id: { type: integer, format: int64 }
        question: { type: string }
        answer: { type: string }
    Mode:
      type: string
      enum: [business, creator]
      description: Режим аккаунта — один аккаунт может быть и бизнесом, и автором
    AuthConfig:
      type: object
      required: [email, google, telegram, csrfToken]
      properties:
        email: { type: boolean, description: Вход по почте доступен }
        google: { type: boolean, description: Ключи Google заданы — показывать кнопку }
        telegram:
          nullable: true
          description: null — бот не подключён, кнопка скрыта
          type: object
          required: [botId, botName, bot]
          properties:
            botId: { type: string, description: Числовой id бота для Telegram Login (запасной способ — окно-виджет) }
            botName: { type: string, description: Имя бота без @ }
            bot: { type: boolean, description: Вход через бота доступен (основной способ) }
        csrfToken: { type: string }
    EmailStart:
      type: object
      required: [email, consent]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254, example: anna@mail.ru }
        consent: { type: boolean, description: Согласие на обработку персональных данных — должно быть true }
    CodeSent:
      type: object
      required: [email, resendAfter, expiresIn]
      properties:
        email: { type: string }
        resendAfter: { type: integer, example: 60, description: Секунд до «Отправить ещё раз» }
        expiresIn: { type: integer, example: 600, description: Срок кода, секунд }
    EmailVerify:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
    TelegramLogin:
      type: object
      required: [user, consent]
      additionalProperties: false
      properties:
        consent: { type: boolean }
        user:
          type: object
          description: Объект из Telegram Login как есть (id, first_name, last_name, username, photo_url, auth_date, hash)
          additionalProperties: true
    BotStart:
      type: object
      required: [consent]
      additionalProperties: false
      properties:
        consent: { type: boolean }
    BotLink:
      type: object
      required: [url, expiresIn]
      properties:
        url: { type: string, example: "https://t.me/reklama_auth_bot?start=login_AbC…" }
        expiresIn: { type: integer, example: 300, description: Срок ссылки, секунд }
    BotStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, ok] }
        user: { $ref: "#/components/schemas/User" }
        next: { type: string, enum: [/app] }
        created: { type: boolean }
    ModeInput:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { $ref: "#/components/schemas/Mode" }
    BasicsInput:
      type: object
      required: [name, city]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80, description: Как вас называть }
        city: { type: string, minLength: 2, maxLength: 80 }
    BusinessProfileInput:
      type: object
      required: [name, city, spheres]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80, description: Название компании или бренда }
        city: { type: string, minLength: 2, maxLength: 80 }
        spheres: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: slug тем }
    CreatorProfileInput:
      type: object
      required: [name, city, spheres, channels]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80, description: Имя или псевдоним }
        city: { type: string, minLength: 2, maxLength: 80 }
        spheres: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: Темы (slug) }
        channels: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: https://… или @имя }
    BusinessProfile:
      type: object
      required: [name, city, spheres, updatedAt]
      properties:
        name: { type: string }
        city: { type: string }
        spheres: { type: array, items: { type: string } }
        updatedAt: { type: string, format: date-time }
    CreatorProfile:
      type: object
      required: [name, city, spheres, channels, updatedAt]
      properties:
        name: { type: string }
        city: { type: string }
        spheres: { type: array, items: { type: string } }
        channels: { type: array, items: { type: string } }
        updatedAt: { type: string, format: date-time }
    BusinessProfileResult:
      type: object
      required: [profile]
      properties:
        profile:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BusinessProfile" }]
    CreatorProfileResult:
      type: object
      required: [profile]
      properties:
        profile:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CreatorProfile" }]
    User:
      type: object
      required: [id, name, email, avatarUrl, city, mode, onboarded]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, nullable: true }
        avatarUrl: { type: string }
        city: { type: string }
        mode: { $ref: "#/components/schemas/Mode" }
        onboarded: { type: boolean, description: Общие данные профиля сохранялись }
    LoginResult:
      type: object
      required: [user, next, created]
      properties:
        user: { $ref: "#/components/schemas/User" }
        next: { type: string, enum: [/app], description: Куда перейти }
        created: { type: boolean, description: Аккаунт создан этим входом }
    Step:
      type: object
      required: [key, done]
      properties:
        key: { type: string, enum: [basics, profile, telegram], description: "Общие данные | профиль активного режима | Telegram привязан" }
        done: { type: boolean }
    Me:
      type: object
      required: [user, providers, profiles, checklist, completion]
      properties:
        user: { $ref: "#/components/schemas/User" }
        providers:
          type: array
          items: { type: string, enum: [email, telegram, google] }
        profiles:
          type: object
          required: [business, creator]
          description: Какие профили режимов заполнены
          properties:
            business: { type: boolean }
            creator: { type: boolean }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/Step" }
        completion: { type: integer, minimum: 0, maximum: 100, description: "Прогресс заполнения для активного режима, %" }
    Status:
      type: string
      enum: [draft, pending_review, published, rejected, expired]
      description: "Черновик | на проверке | опубликовано | отклонено (с причиной) | завершено (срок публикации прошёл, только задания)"
    Block:
      type: object
      required: [kind, title, items]
      additionalProperties: false
      description: "Динамический блок: text — абзацы, list — пункты, links — ссылки https://…"
      properties:
        kind: { type: string, enum: [text, list, links] }
        title: { type: string, maxLength: 60 }
        items: { type: array, maxItems: 15, items: { type: string, maxLength: 1000 } }
    Photo:
      type: object
      required: [id, thumb, src, large]
      properties:
        id: { type: string }
        thumb: { type: string, description: "320 px" }
        src: { type: string, description: "800 px" }
        large: { type: string, description: "1600 px" }
    TaskFormat:
      type: string
      enum: [reels, shorts, youtube, vk_clips, tiktok, telegram]
      description: Форматы списка (отбор ленты)
    FormatItem:
      type: object
      required: [id, title, builtin, own]
      properties:
        id: { type: string, description: "slug формата списка или название своего" }
        title: { type: string }
        builtin: { type: boolean }
        own: { type: boolean, description: Уже использован бизнесом }
    TaskInput:
      type: object
      required: [title, city, nationwide, categories, formats, access, minViews, rewardKopecks, publishBy, publishTime, blocks, cover, photos]
      additionalProperties: false
      description: Черновик может быть неполным; ограничения формы проверяются всегда, обязательность — при отправке.
      properties:
        title: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 80 }
        nationwide: { type: boolean, description: "«Вся Россия»" }
        categories: { type: array, maxItems: 5, items: { type: string }, description: "slug общих или своих категорий (своих — до 3), по порядку выбора; к отправке — хотя бы одна" }
        formats:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 30 }
          description: |
            Slug формата списка (`TaskFormat`) или своё название (2–30 символов, буквы; без ссылок). Сервер нормализует:
            название формата списка → его slug, известное — его написание, своё — без лишних пробелов, с заглавной;
            повторы (без учёта регистра и ё) отбрасываются.
        access: { type: string, enum: [open, approval, ""] }
        minViews: { type: integer, format: int64, minimum: 0, maximum: 1000000000, description: Условие выполнения — просмотры }
        rewardKopecks: { type: integer, format: int64, minimum: 0, maximum: 100000000 }
        publishBy: { type: string, description: "ГГГГ-ММ-ДД или \"\"; к отправке — от завтра до 90 дней (по Москве)" }
        publishTime: { type: string, description: "ЧЧ:ММ по Москве или \"\" — до конца дня" }
        blocks: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/Block" } }
        cover: { type: string, description: "id фото task_cover или \"\"" }
        photos: { type: array, maxItems: 6, items: { type: string }, description: id фото task_photo по порядку }
    Task:
      type: object
      required: [id, status, rejectReason, title, city, nationwide, categories, formats, access, minViews, rewardKopecks, publishBy, publishTime, deadlineAt, blocks, cover, photos, createdAt, updatedAt, submittedAt, publishedAt]
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/Status" }
        rejectReason: { type: string }
        title: { type: string }
        city: { type: string }
        nationwide: { type: boolean }
        categories: { type: array, items: { type: string } }
        categoryTitles: { type: array, items: { type: string }, description: Названия сфер по порядку (только в ленте и на странице задания) }
        formats: { type: array, items: { type: string }, description: Slug формата списка или своё название }
        access: { type: string, enum: [open, approval] }
        minViews: { type: integer, format: int64 }
        rewardKopecks: { type: integer, format: int64 }
        publishBy: { type: string, format: date, nullable: true }
        publishTime: { type: string, description: "ЧЧ:ММ по Москве или \"\"" }
        deadlineAt: { type: string, format: date-time, nullable: true, description: Срок целиком (UTC); прошёл — задание завершается и в ленте не видно }
        blocks: { type: array, items: { $ref: "#/components/schemas/Block" } }
        cover: { nullable: true, allOf: [{ $ref: "#/components/schemas/Photo" }] }
        photos: { type: array, items: { $ref: "#/components/schemas/Photo" } }
        brand: { type: string, description: Название бизнеса (только в ленте) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
    Feed:
      type: object
      required: [tasks, next]
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
        next: { type: string, nullable: true, description: Курсор следующей страницы }
    PlatformInput:
      type: object
      required: [url, followers]
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 300, description: "https://… (http повышается)" }
        followers: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
    Platform:
      type: object
      required: [kind, url, followers]
      properties:
        kind: { type: string, enum: [telegram, youtube, vk, tiktok, instagram, dzen, rutube, other], description: По домену }
        url: { type: string }
        followers: { type: integer, format: int64 }
    CardInput:
      type: object
      required: [name, city, topics, platforms, blocks, avatar, works]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        city: { type: string, maxLength: 80 }
        topics: { type: array, maxItems: 5, items: { type: string }, description: "slug; своих — до 3" }
        platforms: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/PlatformInput" } }
        blocks: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/Block" } }
        avatar: { type: string, description: "id фото card_avatar или \"\"" }
        works: { type: array, maxItems: 9, items: { type: string }, description: id фото card_work по порядку }
    Card:
      type: object
      required: [id, status, rejectReason, name, city, topics, platforms, blocks, avatar, works, updatedAt, submittedAt, publishedAt]
      properties:
        id: { type: integer, format: int64, description: id автора — адрес страницы анкеты }
        status: { $ref: "#/components/schemas/Status" }
        rejectReason: { type: string }
        name: { type: string }
        city: { type: string }
        topics: { type: array, items: { type: string } }
        topicTitles: { type: array, items: { type: string }, description: Названия тем (лента и страница анкеты) }
        platforms: { type: array, items: { $ref: "#/components/schemas/Platform" } }
        blocks: { type: array, items: { $ref: "#/components/schemas/Block" } }
        avatar: { nullable: true, allOf: [{ $ref: "#/components/schemas/Photo" }] }
        works: { type: array, items: { $ref: "#/components/schemas/Photo" } }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
    DraftResult:
      type: object
      required: [draft]
      properties:
        draft:
          type: object
          nullable: true
          required: [form, data, savedAt]
          properties:
            form: { type: string }
            data: { type: object, additionalProperties: true }
            savedAt: { type: string, format: date-time }
    CardFeed:
      type: object
      required: [cards, next]
      properties:
        cards: { type: array, items: { $ref: "#/components/schemas/Card" } }
        next: { type: string, nullable: true, description: Курсор следующей страницы }
    CardResult:
      type: object
      required: [card]
      properties:
        card: { nullable: true, allOf: [{ $ref: "#/components/schemas/Card" }] }
    CategoryItem:
      type: object
      required: [slug, title, icon, status, own]
      properties:
        slug: { type: string }
        title: { type: string }
        icon: { type: string }
        status: { type: string, enum: [approved, pending_review, rejected] }
        own: { type: boolean, description: Своя (ещё не общая) }
    CategoryList:
      type: object
      required: [common, own]
      properties:
        common: { type: array, items: { $ref: "#/components/schemas/CategoryItem" } }
        own: { type: array, items: { $ref: "#/components/schemas/CategoryItem" } }
    CategoryCreated:
      type: object
      required: [category, created]
      properties:
        category: { $ref: "#/components/schemas/CategoryItem" }
        created: { type: boolean }
    MediaPurpose:
      type: string
      enum: [avatar, task_cover, task_photo, card_avatar, card_work]
      description: "Аватар 1:1 | обложка задания 16:9 | пример к заданию | аватар анкеты 1:1 | пример работы"
    Media:
      allOf:
        - { $ref: "#/components/schemas/Photo" }
        - type: object
          required: [purpose, width, height]
          properties:
            purpose: { $ref: "#/components/schemas/MediaPurpose" }
            width: { type: integer }
            height: { type: integer }
