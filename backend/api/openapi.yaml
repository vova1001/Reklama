        email: { type: string }
        city: { type: string }
        avatarUrl: { type: string }
        role: { type: string, enum: ["", moderator, admin] }
        businessName: { type: string }
        creatorName: { type: string }
        blocked: { type: boolean }
        blockedAt: { type: string, format: date-time, nullable: true }
        blockedReason: { type: string }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    Complaint:
      type: object
      required: [id, subject, subjectId, reporterId, reason, comment, status, action, resolution, resolvedAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        subject: { type: string }
        subjectId: { type: integer, format: int64 }
        reporter: { type: string }
        reporterId: { type: integer, format: int64 }
        reason: { type: string }
        comment: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        action: { type: string }
        resolution: { type: string }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    StatusChange:
      type: object
      required: [from, to, reason, actorId, auto, at]
      properties:
        from: { type: string }
        to: { type: string }
        reason: { type: string }
        actorId: { type: integer, format: int64 }
        auto: { type: boolean }
        at: { type: string, format: date-time }
    AdminCategory:
      type: object
      required: [id, slug, title, status, authorId]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        status: { type: string }
        authorId: { type: integer, format: int64 }
    ReviewItem:
      type: object
      required: [type, id, inQueue, waitingSince, lease, owner, history, decisions, complaints]
      properties:
        type: { $ref: "#/components/schemas/ReviewKind" }
        id: { type: string }
        inQueue: { type: boolean }
        waitingSince: { type: string, format: date-time, nullable: true }
        lease: { nullable: true, allOf: [{ $ref: "#/components/schemas/Lease" }] }
        task: { $ref: "#/components/schemas/Task" }
        liveTask: { $ref: "#/components/schemas/Task" }
        card: { $ref: "#/components/schemas/Card" }
        liveCard: { $ref: "#/components/schemas/Card" }
        page: { $ref: "#/components/schemas/Page" }
        livePage: { $ref: "#/components/schemas/Page" }
        category: { $ref: "#/components/schemas/AdminCategory" }
        usage: { type: object, properties: { tasks: { type: integer }, cards: { type: integer } } }
        targets: { type: array, items: { $ref: "#/components/schemas/AdminCategory" } }
        format: { type: object, properties: { norm: { type: string }, title: { type: string }, tasks: { type: integer } } }
        formats: { type: array, items: { type: string } }
        owner: { nullable: true, allOf: [{ $ref: "#/components/schemas/AdminUser" }] }
        history: { type: array, items: { $ref: "#/components/schemas/StatusChange" } }
        decisions: { type: array, items: { $ref: "#/components/schemas/Decision" } }
        complaints: { type: array, items: { $ref: "#/components/schemas/Complaint" } }
    ComplaintGroups:
      type: object
      required: [items, total]
      properties:
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [subject, subjectId, targetId, targetName, total, reasons, firstAt]
            properties:
              subject: { type: string }
              subjectId: { type: integer, format: int64 }
              targetId: { type: integer, format: int64 }
              targetName: { type: string }
              total: { type: integer }
              reasons: { type: array, items: { type: string } }
              firstAt: { type: string, format: date-time }
    ComplaintCase:
      type: object
      required: [subject, id, complaints, target]
      properties:
        subject: { type: string }
        id: { type: integer, format: int64 }
        complaints: { type: array, items: { $ref: "#/components/schemas/Complaint" } }
        task: { $ref: "#/components/schemas/Task" }
        card: { $ref: "#/components/schemas/Card" }
        target: { nullable: true, allOf: [{ $ref: "#/components/schemas/AdminUser" }] }
    ReasonInput:
      type: object
      required: [reason]
      properties: { reason: { type: string, description: 5–500 символов } }
    UserCard:
      type: object
      required: [user, providers, business, creator, tasks, card, socials, logins, decisions, complaints]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        providers: { type: array, items: { type: string } }
        business: { nullable: true, allOf: [{ $ref: "#/components/schemas/BusinessProfile" }] }
        creator: { nullable: true, allOf: [{ $ref: "#/components/schemas/CreatorProfile" }] }
        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
        card: { nullable: true, allOf: [{ $ref: "#/components/schemas/Card" }] }
        socials:
          type: array
          items:
            type: object
            required: [platform, type, title, handle, url, status, followers, verifiedAt]
            properties:
              platform: { type: string }
              type: { type: string }
              title: { type: string }
              handle: { type: string }
              url: { type: string }
              status: { type: string }
              followers: { type: integer, format: int64 }
              verifiedAt: { type: string, format: date-time, nullable: true }
        logins:
          type: array
          items:
            type: object
            required: [method, ip, device, at]
            properties:
              method: { type: string }
              ip: { type: string }
              device: { type: string }
              at: { type: string, format: date-time }
        decisions: { type: array, items: { $ref: "#/components/schemas/Decision" } }
        complaints: { type: array, items: { $ref: "#/components/schemas/Complaint" } }
    AuditEntry:
      type: object
      required: [id, actorId, actorLabel, actorRole, action, subject, subjectId, before, after, reason, ip, device, at]
      properties:
        id: { type: integer, format: int64 }
        actorId: { type: integer, format: int64 }
        actorLabel: { type: string }
        actorRole: { type: string }
        action: { type: string }
        subject: { type: string }
        subjectId: { type: string }
        before: { nullable: true, description: Состояние до (JSON) }
        after: { nullable: true, description: Состояние после (JSON) }
        reason: { type: string }
        ip: { type: string }
        device: { type: string }
        at: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, next]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next: { type: integer, format: int64, nullable: true, description: Курсор следующей страницы (before) }
    AdminSettings:
      type: object
      required: [moderationMode, moderationDefault]
      properties:
        moderationMode: { type: string, enum: [auto, manual] }
        moderationDefault: { type: string, enum: [auto, manual], description: Из MODERATION_MODE }
