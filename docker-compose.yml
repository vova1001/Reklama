# «Охват»: всё в Docker. Запуск: docker compose up --build  →  http://localhost:8000
name: ohvat

services:
  db:
    image: ${REGISTRY:-docker.io/library}/postgres:16-alpine
    environment:
      POSTGRES_DB: ohvat
      POSTGRES_USER: ohvat
      # Только для локального запуска; на сервере задаётся в .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohvat -d ohvat"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    environment:
      DATABASE_URL: postgres://ohvat:${POSTGRES_PASSWORD:-local-only}@db:5432/ohvat?sslmode=disable
      # всё остальное — из .env (список и пояснения — .env.example); пусто — значение по умолчанию
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_CODE_TTL_MIN: ${AUTH_CODE_TTL_MIN:-}
      AUTH_CODE_MAX_ATTEMPTS: ${AUTH_CODE_MAX_ATTEMPTS:-}
      AUTH_CODE_RESEND_SEC: ${AUTH_CODE_RESEND_SEC:-}
      AUTH_CODE_PER_EMAIL_HOUR: ${AUTH_CODE_PER_EMAIL_HOUR:-}
      AUTH_CODE_PER_IP_HOUR: ${AUTH_CODE_PER_IP_HOUR:-}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
      MAIL_WORKERS: ${MAIL_WORKERS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    environment:
      BACKEND_URL: http://backend:8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${REGISTRY:-docker.io/library}/nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

  # ---- только для make test: тесты бэка на настоящей PostgreSQL (в памяти) ----
  db-test:
    profiles: [test]
    image: ${REGISTRY:-docker.io/library}/postgres:16-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: build
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    environment:
      TEST_DATABASE_URL: postgres://test:test@db-test:5432/test?sslmode=disable
    command: >
      sh -c "go vet ./... &&
             go test -count=1 -p 1 -coverpkg=./internal/service,./internal/repository,./internal/transport/http -coverprofile=/tmp/c.out ./... &&
             go tool cover -func=/tmp/c.out | tail -1"
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  pgdata:
