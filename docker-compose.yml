# «Охват»: всё в Docker. Запуск: docker compose up --build  →  http://localhost:8000
name: ohvat

services:
  db:
    image: ${REGISTRY:-docker.io/library}/postgres:16-alpine
    environment:
      POSTGRES_DB: ohvat
      POSTGRES_USER: ohvat
      # Только для локального запуска; на сервере задаётся в .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohvat -d ohvat"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Redis: общие лимиты и черновики форм редактора (без него — в памяти и PostgreSQL)
  redis:
    image: ${REGISTRY:-docker.io/library}/redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    environment:
      DATABASE_URL: postgres://ohvat:${POSTGRES_PASSWORD:-local-only}@db:5432/ohvat?sslmode=disable
      # всё остальное — из .env (список и пояснения — .env.example); пусто — значение по умолчанию
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-}
      TELEGRAM_LOGIN_TTL_MIN: ${TELEGRAM_LOGIN_TTL_MIN:-}
      TELEGRAM_LOGIN_PER_IP_HOUR: ${TELEGRAM_LOGIN_PER_IP_HOUR:-}
      TELEGRAM_SEND_RPS: ${TELEGRAM_SEND_RPS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_CODE_TTL_MIN: ${AUTH_CODE_TTL_MIN:-}
      AUTH_CODE_MAX_ATTEMPTS: ${AUTH_CODE_MAX_ATTEMPTS:-}
      AUTH_CODE_RESEND_SEC: ${AUTH_CODE_RESEND_SEC:-}
      AUTH_CODE_PER_EMAIL_HOUR: ${AUTH_CODE_PER_EMAIL_HOUR:-}
      AUTH_CODE_PER_IP_HOUR: ${AUTH_CODE_PER_IP_HOUR:-}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
      RATE_LIMIT_API_RPS: ${RATE_LIMIT_API_RPS:-}
      RATE_LIMIT_API_BURST: ${RATE_LIMIT_API_BURST:-}
      RATE_LIMIT_USER_RPS: ${RATE_LIMIT_USER_RPS:-}
      RATE_LIMIT_USER_BURST: ${RATE_LIMIT_USER_BURST:-}
      TELEGRAM_WEBHOOK_RPS: ${TELEGRAM_WEBHOOK_RPS:-}
      TELEGRAM_WEBHOOK_BURST: ${TELEGRAM_WEBHOOK_BURST:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MAIL_WORKERS: ${MAIL_WORKERS:-}
      TASKS_MAX_PER_USER: ${TASKS_MAX_PER_USER:-}
      MODERATION_SUBMITS_PER_DAY: ${MODERATION_SUBMITS_PER_DAY:-}
      MODERATION_MODE: ${MODERATION_MODE:-}
      KEEPALIVE_URL: ${KEEPALIVE_URL:-}
      DRAFT_MAX_KB: ${DRAFT_MAX_KB:-}
      RATE_LIMIT_DRAFT_RPS: ${RATE_LIMIT_DRAFT_RPS:-}
      RATE_LIMIT_DRAFT_BURST: ${RATE_LIMIT_DRAFT_BURST:-}
      MEDIA_STORE: ${MEDIA_STORE:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      MEDIA_MAX_MB: ${MEDIA_MAX_MB:-}
      MEDIA_QUOTA_MB: ${MEDIA_QUOTA_MB:-}
      MEDIA_MAX_FILES: ${MEDIA_MAX_FILES:-}
      MEDIA_WORKERS: ${MEDIA_WORKERS:-}
      RATE_LIMIT_UPLOAD_RPS: ${RATE_LIMIT_UPLOAD_RPS:-}
      RATE_LIMIT_UPLOAD_BURST: ${RATE_LIMIT_UPLOAD_BURST:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    environment:
      BACKEND_URL: http://backend:8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${REGISTRY:-docker.io/library}/nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

  # ---- только для make test: тесты бэка на настоящей PostgreSQL (в памяти) ----
  db-test:
    profiles: [test]
    image: ${REGISTRY:-docker.io/library}/postgres:16-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    profiles: [test]
    image: ${REGISTRY:-docker.io/library}/redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: test
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    environment:
      TEST_DATABASE_URL: postgres://test:test@db-test:5432/test?sslmode=disable
      TEST_REDIS_URL: redis://redis-test:6379/0
    command: >
      sh -c "go vet ./... &&
             go test -count=1 -p 1 -race -coverpkg=./internal/service,./internal/repository,./internal/transport/...,./internal/gateway/telegram,./internal/gateway/imaging,./internal/gateway/storage,./internal/ratelimit -coverprofile=/tmp/c.out ./... &&
             go tool cover -func=/tmp/c.out | tail -1"
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

volumes:
  pgdata:
