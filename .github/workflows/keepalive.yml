# Пинг сайта на бесплатном Render, чтобы он не засыпал (Render усыпляет сервис через 15 минут без запросов).
# Основной пинг — самопинг в бэкенде (KEEPALIVE_URL, раз в 10 минут); этот — запасной: GitHub запускает расписание
# с задержками до нескольких часов.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 -o /dev/null -w "%{http_code}\n" https://ohvat-jif6.onrender.com/healthz
