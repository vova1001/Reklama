# Render Blueprint: один бесплатный веб-сервис (nginx + Astro + Go в одном контейнере).
# База — Neon (бесплатная PostgreSQL). Строку подключения вводит владелец в настройках Render (sync: false), в файлах её нет.
services:
  - type: web
    name: ohvat
    runtime: docker
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Neon → Connect → строка подключения (без -pooler), с ?sslmode=require
        sync: false
      - key: PUBLIC_URL
        value: https://ohvat-jif6.onrender.com
